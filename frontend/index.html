<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const loadApp = async () => {
        if (import.meta.env && import.meta.env.DEV && !window.__vite_plugin_react_preamble_installed__) {
          const preamblePath = '/@react-refresh'
          const { default: RefreshRuntime } = await import(preamblePath)
          RefreshRuntime.injectIntoGlobalHook(window)
          window.$RefreshReg$ = () => {}
          window.$RefreshSig$ = () => (type) => type
          window.__vite_plugin_react_preamble_installed__ = true
        }
        await import('/src/main.jsx')
      }
      loadApp()
    </script>
  </body>
</html>
