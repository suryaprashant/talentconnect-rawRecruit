name: Deploy to VPS (Test)

on:
  push:
    branches:
      - stage

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

    
      - name: Install backend dependencies
        working-directory: BackEnd
        run: npm install

      - name: Backend syntax validation
        working-directory: BackEnd
        run: node -c src/app.js

      
      - name: Install frontend dependencies
        working-directory: FrontEnd
        run: npm install

      - name: Frontend build validation
        working-directory: FrontEnd
        run: npm run build

      
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/rr-test/talentconnect-rawRecruit
            git fetch origin
            git checkout stage
            git pull origin stage

            cd FrontEnd
            npm install
            npm run build

            cd ../BackEnd
            npm install
            pm2 reload rawrecruit-test || pm2 start src/app.js --name rawrecruit-test
            pm2 reload rr-test-worker || pm2 start src/workers/index.js --name rr-test-worker
